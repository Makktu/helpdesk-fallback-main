<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <title>HELPDESK FALLBACK</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>

    <!-- Main Form Container -->
    <div class="helpdesk-fallback-form">
      <h2>HELPDESK FALLBACK SHEET</h2>

      <form>
        <!-- Date & Time Section -->
        <div class="form-group date-time-group">
          <label>DATE & TIME</label>
          <div class="date-time-container">
            <div class="date-display"></div>
            <input type="hidden" id="date-input" />
            <div class="time-inputs">
              <span>at</span>
              <select id="hour-select"></select>
              <span>:</span>
              <select id="minute-select"></select>
            </div>
          </div>
        </div>

        <!-- Staff Name -->
        <div class="form-group">
          <label>STAFF NAME</label>
          <input type="text" id="staff-name" />
        </div>

        <!-- Staff Extension -->
        <div class="form-group">
          <label>STAFF EXTENSION</label>
          <input type="text" id="staff-extension" />
        </div>

        <!-- Contract Category -->
        <div class="form-group dropdown-group">
          <label>CONTRACT</label>
          <select id="category-select">
            <option value="">Select Contract</option>
            <option value="PORT">PORT</option>
            <option value="DOM">DOM</option>
            <option value="CAT">CAT</option>
            <option value="MFC">MFC</option>
            <option value="MFR">MFR</option>
            <option value="SEC">SEC</option>
            <option value="TRANS">TRANS</option>
            <option value="LIN">LIN</option>
            <option value="WASTE">WASTE</option>
          </select>
        </div>

        <!-- From Location -->
        <div class="form-group">
          <label>FROM LOCATION</label>
          <input type="text" id="from" />
        </div>

        <!-- To Location -->
        <div class="form-group">
          <label>TO LOCATION</label>
          <input type="text" id="to" />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label>DESCRIPTION</label>
          <textarea
            id="description"
            rows="12"
            style="overflow: hidden; resize: none; max-height: 100vh"
            onscroll="this.scrollTop = 0"
            oninput="this.value = this.value.slice(0, this.maxLength);"
            maxlength="200"
          ></textarea>
        </div>

        <!-- Passed To -->
        <div class="form-group">
          <label>PASSED TO</label>
          <input type="text" id="passed-to" />
        </div>

        <!-- HD Operator -->
        <div class="form-group dropdown-group">
          <label>HD OPERATOR</label>
          <select id="operator-select">
            <option value="">NAME</option>
          </select>
        </div>

        <!-- Job Reference Number -->
        <div class="form-group">
          <label>JOB REFERENCE NUMBER</label>
          <input type="text" id="job-reference" />
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button type="button" id="clear-btn">Clear Form</button>
          <button type="button" id="print-btn">Print Form</button>
          <button type="button" id="print-batch-btn">Print Batch</button>
          <button type="button" id="reset-btn" class="reset-button">
            Reset Job Numbers
          </button>
        </div>
      </form>
    </div>

    <script src="helpdesk-fallback.js"></script>
  </body>
</html>
