<!DOCTYPE html>
<html>
<head>
   <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
<title>HELPDESK FALLBACK</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" />
<style>
 :root {
     --bg: #b1cecd;
     --text: #1f2937;
     --card-bg: #ffffff;
     --card-text: #374151;
     --card-border: #e5e7eb;
     --muted-text: #4b5563;
     --input-bg: #ffffff;
     --input-border: #d1d5db;
     --select-bg: #f9fafb;
     --chip-bg: #ffffff;
     --chip-border: #d1d5db;
     --button-bg: #f3f4f6;
     --button-border: #e5e7eb;
     --button-hover-bg: #e5e7eb;
     --reset-bg: #ffffff;
     --reset-border: #d1d5db;
 }

 .dark {
     --bg: #032059;
     --text: #e5e7eb;
     --card-bg: #0f172a;
     --card-text: #e5e7eb;
     --card-border: #1f2a44;
     --muted-text: #cbd5e1;

     --input-border: #24324d;

     --chip-bg: #0b1220;
     --chip-border: #24324d;
     --button-bg: #111827;
     --button-border: #24324d;
     --button-hover-bg: #182338;
     --reset-bg: #0b1220;
     --reset-border: #24324d;
 }

 body {
     font-family: 'Montserrat', sans-serif;
     margin: 0;
     padding: 20px;
     background: var(--bg);
     color: var(--text);
 }
</style>
